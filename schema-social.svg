<svg width="100%" viewBox="0 0 1200 1320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Archivo, sans-serif">
<title>How a composed configuration wakes a memory</title>
<desc>Three independently authored facts converge; a predicate gate wakes a dormant memory and the model's decision flips from 9 to 65 percent. Flip one relation and the memory stays asleep at 61 percent revert.</desc>
<rect width="1200" height="1320" fill="#F8F5F0"/>
<text x="84" y="128" fill="#16150F" font-size="42" font-weight="600">Three authored facts</text>
<text x="84" y="166" fill="#8A8377" font-size="20">Each written independently. None mentions the others.</text>
<g>
<rect x="84" y="210" width="328" height="124" rx="12" fill="#EDE8DF"/>
<text x="110" y="252" fill="#8A8377" font-size="13" letter-spacing="1.8" font-weight="500">TASK</text>
<text x="110" y="286" fill="#16150F" font-size="20">restore the payments</text>
<text x="110" y="312" fill="#16150F" font-size="20">system</text>
</g>
<g>
<rect x="436" y="210" width="328" height="124" rx="12" fill="#EDE8DF"/>
<text x="462" y="252" fill="#8A8377" font-size="13" letter-spacing="1.8" font-weight="500">OBSERVATION</text>
<text x="462" y="286" fill="#16150F" font-size="20">payments is degraded</text>
</g>
<g>
<rect x="788" y="210" width="328" height="124" rx="12" fill="#EDE8DF"/>
<text x="814" y="252" fill="#8A8377" font-size="13" letter-spacing="1.8" font-weight="500">EVIDENCE</text>
<text x="814" y="286" fill="#16150F" font-size="20">a change hit payments</text>
</g>
<g fill="none" stroke="#A49B8C" stroke-width="1.25" stroke-linecap="round">
<path d="M600 334 V462"/>
<path d="M248 334 V376 Q248 388 260 388 H588 Q600 388 600 400"/>
<path d="M952 334 V376 Q952 388 940 388 H612 Q600 388 600 400"/>
<path d="M590 450 L600 462 L610 450"/>
</g>
<text x="928" y="372" fill="#8A8377" font-size="16" text-anchor="end">all name the same system</text>
<rect x="418" y="470" width="364" height="88" rx="12" fill="#F8F5F0" stroke="#16150F" stroke-width="1.5"/>
<text x="446" y="504" fill="#8A8377" font-size="13" letter-spacing="1.8" font-weight="500">PREDICATE</text>
<text x="446" y="538" fill="#16150F" font-size="20">do the facts form a situation?</text>
<g fill="none" stroke="#A49B8C" stroke-width="1.25" stroke-linecap="round">
<path d="M600 558 V650"/>
<path d="M590 638 L600 650 L610 638"/>
</g>
<text x="616" y="622" fill="#8A8377" font-size="16">yes, wake</text>
<g>
<rect x="400" y="660" width="400" height="104" rx="12" fill="#EDE8DF"/>
<text x="428" y="702" fill="#16150F" font-size="22" font-weight="500">Dormant memory wakes</text>
<text x="428" y="732" fill="#8A8377" font-size="17">a past incident, now relevant</text>
</g>
<g fill="none" stroke="#A49B8C" stroke-width="1.25" stroke-linecap="round">
<path d="M600 764 V818"/>
<path d="M590 806 L600 818 L610 806"/>
</g>
<g>
<rect x="400" y="830" width="400" height="104" rx="12" fill="#EDE8DF"/>
<text x="428" y="872" fill="#16150F" font-size="22" font-weight="500">The model's decision changes</text>
<text x="428" y="902" fill="#8A8377" font-size="17">picks the cache fix instead of revert</text>
</g>
<text x="1116" y="892" fill="#E8442E" font-size="54" font-weight="600" text-anchor="end">9% &#8594; 65%</text>
<text x="1116" y="924" fill="#8A8377" font-size="15" text-anchor="end">P(cache fix)</text>
<line x1="84" y1="990" x2="1116" y2="990" stroke="#C9C2B4" stroke-width="1"/>
<text x="84" y="1040" fill="#16150F" font-size="28" font-weight="600">The counterfactual</text>
<g>
<rect x="84" y="1076" width="470" height="112" rx="12" fill="#EDE8DF"/>
<text x="112" y="1114" fill="#E8442E" font-size="13" letter-spacing="1.8" font-weight="600">FLIP ONE RELATION</text>
<text x="112" y="1146" fill="#16150F" font-size="19">evidence now names a different system</text>
</g>
<g fill="none" stroke="#A49B8C" stroke-width="1.25" stroke-linecap="round">
<path d="M570 1132 H654"/>
<path d="M644 1122 L656 1132 L644 1142"/>
</g>
<g>
<rect x="664" y="1076" width="452" height="112" rx="12" fill="none" stroke="#B8B0A4" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="692" y="1114" fill="#6E675B" font-size="21" font-weight="500">Memory stays asleep</text>
<text x="692" y="1146" fill="#8A8377" font-size="17">same prompt &#183; reverts again (61%)</text>
</g>
<line x1="84" y1="1240" x2="1116" y2="1240" stroke="#C9C2B4" stroke-width="1"/>
<text x="84" y="1272" fill="#8A8377" font-size="14">Jacobian Monologue &#8212; the USD wake mechanism</text>
<text x="1116" y="1272" fill="#8A8377" font-size="14" text-anchor="end">github.com/JosephOIbrahim/jacobian-monologue</text>
</svg>
