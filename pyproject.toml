[project]
name = "jacobian-monologue"
version = "0.1.1"
description = "Configuration-gated memory delivery to a language model. Measurement instrument."
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers>=5.5",
    "torch",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

# The proprietary substrate under test is NOT a dependency of this package.
# For m1-m4 it (or a user-supplied ranker) is installed editable from a
# separate checkout: `uv pip install -e /path/to/substrate`. See README.
# The build identifier pinned at experiment start is recorded in
# src/probe/pins.py (SUBSTRATE_VERSION) and embedded in every results/*.json.
# If the substrate moves off that pin mid-experiment, prior results are void.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
